<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-labelledby="t d">
  <title id="t">TAVR illustration</title>
  <desc id="d">A heart with a thin tube carrying a new valve into the narrowed aortic valve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e6ff" />
      <stop offset="0.55" stop-color="#efe3f7" />
      <stop offset="1" stop-color="#fbd9e4" />
    </linearGradient>
    <linearGradient id="heart" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffd6e0" />
      <stop offset="0.6" stop-color="#f4a3bb" />
      <stop offset="1" stop-color="#e57e9f" />
    </linearGradient>
    <linearGradient id="vessel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfeee3" />
      <stop offset="1" stop-color="#8fd0bd" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8" />
      <stop offset="1" stop-color="#f0c75a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a5fb8" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="500" height="400" fill="url(#bg)" />
  <circle cx="395" cy="95" r="120" fill="url(#glow)" />
  <circle cx="90" cy="330" r="110" fill="url(#glow)" opacity="0.7" />

  <!-- aorta: rises from the heart, arches over, and comes down -->
  <g filter="url(#soft)">
    <path d="M204 150 C204 92 255 56 320 62 C375 68 396 110 392 240" fill="none" stroke="url(#vessel)" stroke-width="46" stroke-linecap="round" />
    <path d="M204 150 C204 92 255 56 320 62 C375 68 396 110 392 240" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" transform="translate(-6 -8)" />
  </g>

  <!-- heart -->
  <g filter="url(#soft)">
    <path d="M205 150 C205 112 150 100 128 140 C100 190 138 250 205 330 C272 250 310 190 282 140 C260 100 205 112 205 150 Z" fill="url(#heart)" />
    <path d="M150 150 C160 128 182 126 192 140" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- the thin tube (catheter) enters low on the right, runs up the vessel and over the arch to the valve -->
  <path d="M480 345 C430 345 394 315 392 240 C392 112 372 68 320 62 C262 56 214 90 206 128" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  <path d="M480 345 C430 345 394 315 392 240 C392 112 372 68 320 62 C262 56 214 90 206 128" fill="none" stroke="#7d6cc4" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 10" />

  <!-- the new valve: a small metal frame with leaflets -->
  <g transform="translate(204 150)" filter="url(#soft)">
    <path d="M-28 -24 h56 l-6 62 h-44 Z" fill="url(#frame)" stroke="#e1b64a" stroke-width="2" />
    <ellipse cx="0" cy="-24" rx="28" ry="8" fill="#fff6d0" stroke="#e1b64a" stroke-width="2" />
    <path d="M-20 -22 l40 40 M20 -22 l-40 40 M-12 -22 l32 38 M12 -22 l-32 38" stroke="#e1b64a" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M-16 -8 q16 22 32 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- small sparkles -->
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="70" cy="90" r="5" />
    <circle cx="440" cy="250" r="4" />
    <circle cx="330" cy="330" r="3" />
  </g>
</svg>
