<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="660" viewBox="0 0 1700 660"><rect width="1700" height="660" fill="#faf8ff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b4f6b"/></marker></defs><text x="30" y="44" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#1d2233" text-anchor="start">What happens when a patient asks a question</text><text x="30" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#55597a" text-anchor="start">Eight steps. The model only writes friendly wording; rules in our own code decide what reaches the patient.</text><rect x="30" y="100" width="380" height="232" rx="16" fill="#eef0ff" stroke="#5a58a6" stroke-width="2"/><circle cx="60" cy="134" r="16" fill="#5a58a6"/><text x="60" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="86" y="132" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#5a58a6" text-anchor="start">The patient asks</text><text x="86" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">In the browser</text><text x="58" y="184" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Types or speaks a question in the chat panel.</text><text x="58" y="208" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• The app sends along the current step and the</text><text x="58" y="227" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  part the patient pinned.</text><text x="58" y="251" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Slow (free, local model) or Fast (cloud, paid)</text><text x="58" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  is chosen per question.</text><rect x="450" y="100" width="380" height="232" rx="16" fill="#ffe9ef" stroke="#c74870" stroke-width="2"/><circle cx="480" cy="134" r="16" fill="#c74870"/><text x="480" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="506" y="132" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#c74870" text-anchor="start">Privacy guard</text><text x="506" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">In the browser</text><text x="478" y="184" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Rules and an on-device name finder replace</text><text x="478" y="203" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  personal details with placeholders such as</text><text x="478" y="222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  [PERSON_1].</text><text x="478" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• A final scan blocks the send if anything</text><text x="478" y="265" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  personal remains.</text><text x="478" y="289" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Real values stay in the encrypted vault.</text><rect x="870" y="100" width="380" height="232" rx="16" fill="#e6f6f1" stroke="#25806c" stroke-width="2"/><circle cx="900" cy="134" r="16" fill="#25806c"/><text x="900" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="926" y="132" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#25806c" text-anchor="start">Safety gate</text><text x="926" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">Convex, no model</text><text x="898" y="184" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Emergency symptoms now: a fixed emergency</text><text x="898" y="203" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  message.</text><text x="898" y="227" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Medicine, diagnosis or "ignore your rules": a</text><text x="898" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  fixed reply that points to the care team.</text><text x="898" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• "Zoom in", "go to step 3": answered by rules in</text><text x="898" y="289" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  about a second.</text><rect x="1290" y="100" width="380" height="232" rx="16" fill="#e6f6f1" stroke="#25806c" stroke-width="2"/><circle cx="1320" cy="134" r="16" fill="#25806c"/><text x="1320" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="1346" y="132" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#25806c" text-anchor="start">Find sources</text><text x="1346" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">Convex</text><text x="1318" y="184" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Keyword search and vector search over 84 short</text><text x="1318" y="203" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  facts (80 from the team's TAVR document).</text><text x="1318" y="227" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• The best facts, the current step and the</text><text x="1318" y="246" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  selected part go into the prompt.</text><rect x="30" y="384" width="380" height="232" rx="16" fill="#fff3dd" stroke="#b97d1e" stroke-width="2"/><circle cx="60" cy="418" r="16" fill="#b97d1e"/><text x="60" y="424" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="86" y="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#b97d1e" text-anchor="start">The model answers</text><text x="86" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">Local Llama or cloud model</text><text x="58" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Slow: Llama 3.2 3B through Ollama, about 10 to</text><text x="58" y="487" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  17 seconds.</text><text x="58" y="511" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Fast: Gemini, usually a few seconds.</text><text x="58" y="535" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• It must reply in a fixed JSON format with parts</text><text x="58" y="554" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  to highlight.</text><rect x="450" y="384" width="380" height="232" rx="16" fill="#e6f6f1" stroke="#25806c" stroke-width="2"/><circle cx="480" cy="418" r="16" fill="#25806c"/><text x="480" y="424" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="506" y="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#25806c" text-anchor="start">Check the answer</text><text x="506" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">Convex</text><text x="478" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Advice filter: no doses or "you should stop"</text><text x="478" y="487" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  wording.</text><text x="478" y="511" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Grounding check: numbers and terms must be in</text><text x="478" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  our facts, or the answer is replaced by our own</text><text x="478" y="549" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  text.</text><text x="478" y="573" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Percentages get a "groups, not you" note.</text><rect x="870" y="384" width="380" height="232" rx="16" fill="#e6f6f1" stroke="#25806c" stroke-width="2"/><circle cx="900" cy="418" r="16" fill="#25806c"/><text x="900" y="424" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="926" y="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#25806c" text-anchor="start">Validate the 3D commands</text><text x="926" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">Convex</text><text x="898" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Every scene_action must pass the zod schema and</text><text x="898" y="487" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  exist in the database (part, step).</text><text x="898" y="511" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Failed ones are dropped. The reply carries</text><text x="898" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  sources and a safety note.</text><rect x="1290" y="384" width="380" height="232" rx="16" fill="#eef0ff" stroke="#5a58a6" stroke-width="2"/><circle cx="1320" cy="418" r="16" fill="#5a58a6"/><text x="1320" y="424" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="1346" y="416" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#5a58a6" text-anchor="start">Show it</text><text x="1346" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#55597a" text-anchor="start">In the browser</text><text x="1318" y="468" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• Placeholders are filled back in on the device.</text><text x="1318" y="492" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• The chat shows the answer, sources and follow-</text><text x="1318" y="511" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  ups.</text><text x="1318" y="535" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">• The scene director moves the camera, glows the</text><text x="1318" y="554" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#2b3047" text-anchor="start">  parts and changes the step.</text><path d="M 414 216.0 L 446 216.0" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/><path d="M 834 216.0 L 866 216.0" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/><path d="M 1254 216.0 L 1286 216.0" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/><path d="M 414 500.0 L 446 500.0" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/><path d="M 834 500.0 L 866 500.0" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/><path d="M 1254 500.0 L 1286 500.0" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/><path d="M 1674 216.0 L 1686 216.0 L 1686 358.0 L 220.0 358.0 L 220.0 380" fill="none" stroke="#4b4f6b" stroke-width="2" marker-end="url(#ah)"/></svg>